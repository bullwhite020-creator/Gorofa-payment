<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gorofa Payment App</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#061a3a,#0b5bd3 55%,#16b8a6);
  color:#14213d;
}
.header{
  color:#fff;
  padding:28px 20px 24px;
  text-align:center;
}
.logo{
  width:68px;height:68px;margin:0 auto 12px;
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);
  font-size:34px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
.header h1{margin:0;font-size:25px}
.header p{margin:7px 0 0;color:#dceaff;font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 30px}
.card{
  background:#fff;border-radius:24px;padding:22px;
  box-shadow:0 18px 45px rgba(0,0,0,.20);
}
.status{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;margin-bottom:18px;
  padding:10px 12px;border-radius:12px;background:#f3f7fc;
}
.dot{width:10px;height:10px;border-radius:50%;background:#f0a000}
.dot.ok{background:#18b979}.dot.bad{background:#e53935}
.screen-title{margin:0 0 5px;font-size:22px}
.muted{color:#6d7785;font-size:13px;margin:0 0 18px}
input{
  width:100%;padding:14px 13px;margin:0 0 10px;
  border:1px solid #d9e0ea;border-radius:12px;font-size:15px;
  outline:none;background:#fbfcfe;
}
input:focus{border-color:#1473e6;box-shadow:0 0 0 3px rgba(20,115,230,.10)}
button{
  border:0;border-radius:12px;padding:12px 16px;
  font-weight:700;font-size:14px;cursor:pointer;
}
.primary{width:100%;background:#1167d8;color:#fff}
.secondary{background:#edf4ff;color:#0b5bd3}
.danger{background:#ffe9e9;color:#c62828}
.link{background:none;color:#1167d8;padding:8px 0}
.row{display:flex;gap:9px;align-items:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.error{color:#c62828;font-size:13px;margin:8px 0;min-height:18px}
.topbar{
 display:flex;justify-content:space-between;gap:10px;align-items:center;
 padding-bottom:15px;border-bottom:1px solid #edf0f4;margin-bottom:17px;
}
.email{font-size:12px;color:#687282;overflow:hidden;text-overflow:ellipsis}
.section-title{font-size:15px;margin:20px 0 9px}
.payment{
 display:flex;justify-content:space-between;gap:10px;
 padding:13px 0;border-bottom:1px solid #edf0f4;
}
.payment-name{font-weight:700;font-size:14px}
.payment-meta{font-size:11px;color:#8a93a0;margin-top:4px}
.amount{font-weight:800;white-space:nowrap}
.empty{padding:18px;text-align:center;color:#8a93a0;background:#f7f9fc;border-radius:12px;font-size:13px}
.hidden{display:none!important}
.footer{text-align:center;color:#dbe8ff;font-size:11px;margin-top:15px}
.small{font-size:11px;color:#7b8491}
</style>
</head>

<body>
<div class="header">
  <div class="logo">🏢</div>
  <h1>Gorofa Payment App</h1>
  <p>Secure shared payment management</p>
</div>

<div class="wrap">
  <div class="card">

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="cloudStatus">Connecting to Firebase…</span>
    </div>

    <!-- LOGIN -->
    <section id="loginScreen">
      <h2 class="screen-title">Welcome back</h2>
      <p class="muted">Sign in with your email and password.</p>

      <form id="loginForm">
        <input id="loginUser" type="email" placeholder="Email address"
               autocomplete="username" required>
        <input id="loginPass" type="password" placeholder="Password"
               autocomplete="current-password" required>
        <button class="primary" type="submit">Sign In</button>
      </form>

      <div id="loginError" class="error"></div>

      <div style="text-align:center">
        <button class="link" id="forgotBtn" type="button">Forgot password?</button>
      </div>
    </section>

    <!-- APP -->
    <section id="appScreen" class="hidden">
      <div class="topbar">
        <div>
          <div class="small">SIGNED IN AS</div>
          <div id="userEmail" class="email"></div>
        </div>
        <button id="logoutBtn" class="secondary">Log Out</button>
      </div>

      <h2 class="screen-title">Add payment</h2>
      <p class="muted">Changes are shared with other signed-in users.</p>

      <form id="paymentForm">
        <input id="payName" placeholder="Name" required>
        <input id="payAmount" type="number" step="0.01" min="0"
               placeholder="Amount (KSh)" required>
        <input id="payNote" placeholder="Note (optional)">
        <button id="addBtn" class="primary" type="submit">＋ Save Payment</button>
      </form>

      <h3 class="section-title">Shared payments</h3>
      <div id="payList"></div>

      <div class="actions" style="margin-top:18px">
        <button id="downloadBtn" class="secondary">Download JSON</button>
      </div>
    </section>
  </div>

  <div class="footer">Gorofa Payment App • Firebase connected cloud storage</div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDVBZgQp2u5Awb4O6K1SM9gB6Y-0NpB0GA",
  authDomain: "gorafa-payment.firebaseapp.com",
  projectId: "gorafa-payment",
  storageBucket: "gorafa-payment.firebasestorage.app",
  messagingSenderId: "646663554381",
  appId: "1:646663554381:web:c01ad62ad06a10d71b6304"
};

let auth = null, dbCloud = null, cloudRef = null, unsubscribe = null;
let data = {payments:[]}, busy = false;

const $ = id => document.getElementById(id);

function status(text, type="") {
  $("cloudStatus").textContent = text;
  $("statusDot").className = "dot " + type;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function errorText(err) {
  const code = err && err.code || "";
  const map = {
    "auth/invalid-email":"Enter a valid email address.",
    "auth/user-not-found":"No account was found with this email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"That email is already registered.",
    "auth/weak-password":"Password must be at least 6 characters.",
    "auth/too-many-requests":"Too many attempts. Please try again later.",
    "permission-denied":"Firestore permission denied. Check your Firestore Rules.",
    "failed-precondition":"Firestore is not ready. Check that Firestore Database is enabled.",
    "unavailable":"Firebase is temporarily unavailable. Check your internet connection."
  };
  return map[code] || err?.message || "Something went wrong.";
}

function ready() {
  return !!(auth && dbCloud && cloudRef);
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function render() {
  const list = $("payList");
  const payments = Array.isArray(data.payments) ? data.payments : [];

  if (!payments.length) {
    list.innerHTML = '<div class="empty">No payments yet.</div>';
    return;
  }

  const sorted = [...payments].sort(
    (a,b)=>(b.createdAt||0)-(a.createdAt||0)
  );

  list.innerHTML = sorted.map(p => {
    const amount = Number(p.amount);
    const when = p.createdAt
      ? new Date(p.createdAt).toLocaleString()
      : "";
    return `
      <div class="payment">
        <div>
          <div class="payment-name">${escapeHtml(p.name || "")}</div>
          ${p.note ? `<div class="payment-meta">${escapeHtml(p.note)}</div>` : ""}
          <div class="payment-meta">${escapeHtml(p.by || "")}${when ? " • " + escapeHtml(when) : ""}</div>
        </div>
        <div>
          <div class="amount">KSh ${Number.isFinite(amount) ? amount.toFixed(2) : "0.00"}</div>
          <button class="link" data-delete="${escapeHtml(p.id || "")}">Delete</button>
        </div>
      </div>`;
  }).join("");
}

async function login(e) {
  e.preventDefault();
  $("loginError").textContent = "";
  if (!ready()) {
    $("loginError").textContent = "Firebase is not ready.";
    return;
  }

  try {
    status("Signing in…");
    await auth.signInWithEmailAndPassword(
      $("loginUser").value.trim(),
      $("loginPass").value
    );
    $("loginPass").value = "";
  } catch (err) {
    status("Ready to sign in");
    $("loginError").textContent = errorText(err);
  }
}

async function forgotPassword() {
  if (!ready()) return alert("Firebase is not ready.");
  const email = $("loginUser").value.trim() || prompt("Enter your account email:");
  if (!email) return;

  try {
    await auth.sendPasswordResetEmail(email);
    alert("Password reset email sent. Check your email.");
  } catch (err) {
    alert(errorText(err));
  }
}

async function addPayment(e) {
  e.preventDefault();
  if (!ready() || !auth.currentUser || busy) return;

  const name = $("payName").value.trim();
  const amount = Number($("payAmount").value);
  const note = $("payNote").value.trim();

  if (!name || !Number.isFinite(amount) || amount < 0) {
    alert("Enter a valid name and amount.");
    return;
  }

  const entry = {
    id: makeId(),
    name,
    amount: Math.round(amount * 100) / 100,
    note,
    createdAt: Date.now(),
    by: auth.currentUser.email || auth.currentUser.uid
  };

  busy = true;
  $("addBtn").disabled = true;
  status("Saving…");

  try {
    await cloudRef.set(
      {payments: firebase.firestore.FieldValue.arrayUnion(entry)},
      {merge:true}
    );
    $("payName").value = "";
    $("payAmount").value = "";
    $("payNote").value = "";
    status("Live & synced", "ok");
  } catch (err) {
    console.error(err);
    alert("Save failed: " + errorText(err));
    status("Firestore error", "bad");
  } finally {
    busy = false;
    $("addBtn").disabled = false;
  }
}

async function deletePayment(id) {
  if (!ready() || !auth.currentUser || busy) return;
  const entry = data.payments.find(p => p.id === id);
  if (!entry) return;

  if (!confirm(`Delete payment "${entry.name}"?`)) return;

  busy = true;
  try {
    status("Saving…");
    await cloudRef.set(
      {payments: firebase.firestore.FieldValue.arrayRemove(entry)},
      {merge:true}
    );
  } catch (err) {
    alert("Delete failed: " + errorText(err));
    status("Firestore error", "bad");
  } finally {
    busy = false;
  }
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(data,null,2)], {
    type:"application/json"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gorofa-payments-" +
    new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function startSync() {
  if (unsubscribe) unsubscribe();
  status("Syncing…");

  unsubscribe = cloudRef.onSnapshot(snapshot => {
    data = snapshot.exists ? (snapshot.data() || {}) : {payments:[]};
    if (!Array.isArray(data.payments)) data.payments = [];
    render();
    status("Live & synced", "ok");
  }, err => {
    console.error(err);
    status("Firestore error", "bad");
    alert("Firestore connection error: " + errorText(err));
  });
}

/* Events */
$("loginForm").addEventListener("submit", login);
$("forgotBtn").addEventListener("click", forgotPassword);
$("paymentForm").addEventListener("submit", addPayment);
$("logoutBtn").addEventListener("click", () => auth && auth.signOut());
$("downloadBtn").addEventListener("click", downloadJSON);

$("payList").addEventListener("click", e => {
  const btn = e.target.closest("[data-delete]");
  if (btn) deletePayment(btn.dataset.delete);
});

/* Always show the login screen first.
   Firebase then changes it when the authentication state is known. */
$("loginScreen").classList.remove("hidden");
$("appScreen").classList.add("hidden");

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  dbCloud = firebase.firestore();
  cloudRef = dbCloud.collection("gorofa").doc("sharedData");

  status("Firebase ready — sign in", "ok");

  auth.onAuthStateChanged(user => {
    if (user) {
      $("loginScreen").classList.add("hidden");
      $("appScreen").classList.remove("hidden");
      $("userEmail").textContent = user.email || user.uid;
      startSync();
    } else {
      $("loginScreen").classList.remove("hidden");
      $("appScreen").classList.add("hidden");
      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }
      data = {payments:[]};
      render();
      status("Firebase ready — sign in", "ok");
    }
  });
} catch (err) {
  console.error(err);
  status("Firebase setup error", "bad");
  $("loginError").textContent = "Firebase could not be initialized.";
}

render();
</script>
</body>
</html>
